<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="popupTitle">AutoKetik</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="header">
      <h1 data-i18n="popupTitle">AutoKetik</h1>
      <button id="openSidebar" type="button" class="sidebar-btn" data-i18n="openSidebarBtn" data-i18n-title="openSidebarBtnTitle" title="Buka di panel samping agar tidak tertutup saat berpindah fokus">Buka Sidebar ↗</button>
    </div>

    <label for="source">
      <span data-i18n="sourceLabel">Sumber teks</span>
      <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
        <span class="info-icon">i</span>
        <span class="tip-box" data-i18n="sourceTip">Sumber konten: ketik/tempel langsung, ambil otomatis dari link Google Docs publik, atau unggah file .txt/.html.</span>
      </span>
    </label>
    <select id="source">
      <option value="paste" data-i18n="sourceOptionPaste">Tempel / tulis</option>
      <option value="url" data-i18n="sourceOptionUrl">URL Google Docs publik</option>
      <option value="file" data-i18n="sourceOptionFile">File teks / HTML</option>
    </select>

    <div id="urlBox" class="row hidden">
      <label for="url">
        <input id="url" type="url" placeholder="https://docs.google.com/document/d/...">
      </label>
      <button id="fetch" type="button" class="secondary" data-i18n="fetchBtn">Ambil</button>
    </div>

    <div id="fileBox" class="hidden" style="margin-top: 6px;">
      <input id="file" type="file" accept=".txt,.html,.htm,text/plain,text/html">
    </div>

    <label for="text">
      <span data-i18n="textLabel">Teks yang akan diketik</span>
      <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
        <span class="info-icon">i</span>
        <span class="tip-box" data-i18n="textTip">Isi naskah atau dokumen yang akan disimulasikan ketikannya secara otomatis ke halaman web aktif.</span>
      </span>
    </label>
    <textarea id="text" rows="6" data-i18n-placeholder="textPlaceholder" placeholder="Ketik atau tempel teks di sini..."></textarea>
    <section id="documentPreview" class="document-preview hidden" data-i18n-aria-label="previewAriaLabel" aria-label="Pratinjau dokumen">
      <iframe id="documentFrame" title="Pratinjau dokumen" sandbox=""></iframe>
      <button id="toggleSource" type="button" class="preview-toggle" data-i18n="toggleSourceHtml">Lihat sumber HTML</button>
    </section>

    <div class="grid">
      <div>
        <label for="wpmMin">
          <span data-i18n="wpmLabel">Kecepatan (WPM)</span>
          <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
            <span class="info-icon">i</span>
            <span class="tip-box" data-i18n="wpmTip">Kecepatan mengetik dalam Words Per Minute (konstan atau acak antara dua nilai konstan).</span>
          </span>
        </label>
        <div class="range-control" data-range="wpm">
          <input id="wpmMin" type="number" min="5" max="300" step="1" value="60" data-i18n-aria-label="wpmMinAria" aria-label="Kecepatan WPM minimum">
          <span class="range-separator">—</span>
          <input id="wpmMax" data-range-part="max" type="number" min="5" max="300" step="1" value="75" data-i18n-aria-label="wpmMaxAria" aria-label="Kecepatan WPM maksimum">
          <details class="range-menu"><summary data-i18n-title="rangeMenuTitle" title="Opsi variasi">⌄</summary><div class="range-menu-items"><button type="button" data-range-mode="constant" data-i18n="rangeModeConstant">Konstan</button><button type="button" data-range-mode="random" data-i18n="rangeModeRandom">Acak antara dua nilai konstan</button></div></details>
        </div>
        <input id="wpm" type="hidden" value="60">
        <input id="wpmMode" type="hidden" value="constant">
      </div>
      <div>
        <label for="delay">
          <span data-i18n="delayLabel">Hitung mundur (detik)</span>
          <span class="info-tip tip-right" tabindex="0" role="button" aria-label="Info">
            <span class="info-icon">i</span>
            <span class="tip-box" data-i18n="delayTip">Waktu tunggu sebelum mulai mengetik. Beri Anda jeda waktu untuk mengklik kolom input tujuan di halaman web.</span>
          </span>
        </label>
        <input id="delay" type="number" min="0" max="60" value="5">
      </div>
    </div>

    <details>
      <summary data-i18n="advancedSummary">Simulasi & Tempo Lanjutan</summary>
      <div class="grid" style="margin-top: 8px;">
        <div>
          <label for="wave">
            <span data-i18n="waveLabel">Gelombang (detik)</span>
            <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="waveTip">Panjang siklus ritme manusia (kecepatan mengetik akan naik dan turun secara bertahap menyerupai gelombang).</span>
            </span>
          </label>
          <input id="wave" type="number" value="120">
        </div>
        <div>
          <label for="start">
            <span data-i18n="startLabel">Mulai</span>
            <span class="info-tip tip-right" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="startTip">Tempo awal saat mulai mengetik: 'Cepat' lalu melambat, atau 'Lambat' lalu bertahap semakin cepat.</span>
            </span>
          </label>
          <select id="start">
            <option value="fast" data-i18n="startFast">Cepat</option>
            <option value="slow" data-i18n="startSlow">Lambat</option>
          </select>
        </div>
        <div>
          <label for="typo">
            <span data-i18n="typoLabel">Peluang Typo (0–1)</span>
            <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="typoTip">Peluang salah ketik tombol keyboard tetangga (misal 0.03 = 3% kemungkinan terjadi typo per karakter).</span>
            </span>
          </label>
          <input id="typo" value="0.03">
        </div>
        <div>
          <label for="seed">
            <span data-i18n="seedLabel">Seed (opsional)</span>
            <span class="info-tip tip-right" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="seedTip">Nilai dasar generator acak (RNG). Jika diisi angka yang sama, pola variasi kecepatan dan letak typo akan berulang persis sama.</span>
            </span>
          </label>
          <input id="seed" type="number" data-i18n-placeholder="seedPlaceholder" placeholder="acak">
        </div>
        <div>
          <label for="thinkEveryMin">
            <span data-i18n="thinkEveryLabel">Jeda tiap kata</span>
            <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="thinkEveryTip">Jumlah kata yang diketik sebelum jeda berpikir sejenak seperti manusia (bisa angka tetap atau rentang acak).</span>
            </span>
          </label>
          <div class="range-control" data-range="thinkEvery">
            <input id="thinkEveryMin" type="number" min="1" step="1" value="8" data-i18n-aria-label="thinkEveryMinAria" aria-label="Jumlah minimum kata sebelum jeda">
            <span class="range-separator">—</span>
            <input id="thinkEveryMax" data-range-part="max" type="number" min="1" step="1" value="25" data-i18n-aria-label="thinkEveryMaxAria" aria-label="Jumlah maksimum kata sebelum jeda">
            <details class="range-menu"><summary data-i18n-title="rangeMenuTitle" title="Opsi variasi">⌄</summary><div class="range-menu-items"><button type="button" data-range-mode="constant" data-i18n="rangeModeConstant">Konstan</button><button type="button" data-range-mode="random" data-i18n="rangeModeRandom">Acak antara dua nilai konstan</button></div></details>
          </div>
          <input id="thinkEvery" type="hidden" value="8-25">
          <input id="thinkEveryMode" type="hidden" value="random">
        </div>
        <div>
          <label for="thinkPauseMin">
            <span data-i18n="thinkPauseLabel">Durasi jeda (s)</span>
            <span class="info-tip tip-right" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="thinkPauseTip">Lama waktu berhenti sejenak saat jeda berpikir dalam satuan detik (bisa angka tetap atau rentang acak).</span>
            </span>
          </label>
          <div class="range-control" data-range="thinkPause">
            <input id="thinkPauseMin" type="number" min="0" step="0.1" value="1.5" data-i18n-aria-label="thinkPauseMinAria" aria-label="Durasi jeda minimum dalam detik">
            <span class="range-separator">—</span>
            <input id="thinkPauseMax" data-range-part="max" type="number" min="0" step="0.1" value="6" data-i18n-aria-label="thinkPauseMaxAria" aria-label="Durasi jeda maksimum dalam detik">
            <details class="range-menu"><summary data-i18n-title="rangeMenuTitle" title="Opsi variasi">⌄</summary><div class="range-menu-items"><button type="button" data-range-mode="constant" data-i18n="rangeModeConstant">Konstan</button><button type="button" data-range-mode="random" data-i18n="rangeModeRandom">Acak antara dua nilai konstan</button></div></details>
          </div>
          <input id="thinkPause" type="hidden" value="1.5-6">
          <input id="thinkPauseMode" type="hidden" value="random">
        </div>
        <div>
          <label for="typoWordsMin">
            <span data-i18n="typoWordsLabel">Kata sebelum sadar</span>
            <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="typoWordsTip">Berapa kata yang tetap terus diketik setelah salah ketik sebelum disadari lalu dihapus dengan tombol backspace.</span>
            </span>
          </label>
          <div class="range-control" data-range="typoWords">
            <input id="typoWordsMin" type="number" min="0" step="1" value="1" data-i18n-aria-label="typoWordsMinAria" aria-label="Jumlah minimum kata">
            <span class="range-separator">—</span>
            <input id="typoWordsMax" data-range-part="max" type="number" min="0" step="1" value="3" data-i18n-aria-label="typoWordsMaxAria" aria-label="Jumlah maksimum kata">
            <details class="range-menu"><summary data-i18n-title="rangeMenuTitle" title="Opsi variasi">⌄</summary><div class="range-menu-items"><button type="button" data-range-mode="constant" data-i18n="rangeModeConstant">Konstan</button><button type="button" data-range-mode="random" data-i18n="rangeModeRandom">Acak antara dua nilai konstan</button></div></details>
          </div>
          <input id="typoWords" type="hidden" value="1-3">
          <input id="typoWordsMode" type="hidden" value="random">
        </div>
        <div>
          <label for="typoDelayMin">
            <span data-i18n="typoDelayLabel">Jeda sadar (detik)</span>
            <span class="info-tip tip-right" tabindex="0" role="button" aria-label="Info">
              <span class="info-icon">i</span>
              <span class="tip-box" data-i18n="typoDelayTip">Waktu jeda berhenti sejenak saat menyadari ada kesalahan ketik sebelum mulai menghapus dengan backspace.</span>
            </span>
          </label>
          <div class="range-control" data-range="typoDelay">
            <input id="typoDelayMin" type="number" min="0" step="0.1" value="0.8" data-i18n-aria-label="typoDelayMinAria" aria-label="Jeda minimum dalam detik">
            <span class="range-separator">—</span>
            <input id="typoDelayMax" data-range-part="max" type="number" min="0" step="0.1" value="2" data-i18n-aria-label="typoDelayMaxAria" aria-label="Jeda maksimum dalam detik">
            <details class="range-menu"><summary data-i18n-title="rangeMenuTitle" title="Opsi variasi">⌄</summary><div class="range-menu-items"><button type="button" data-range-mode="constant" data-i18n="rangeModeConstant">Konstan</button><button type="button" data-range-mode="random" data-i18n="rangeModeRandom">Acak antara dua nilai konstan</button></div></details>
          </div>
          <input id="typoDelay" type="hidden" value="0.8-2">
          <input id="typoDelayMode" type="hidden" value="random">
        </div>
      </div>
      <label class="checkbox-label">
        <input id="noTypo" type="checkbox">
        <span data-i18n="noTypoLabel">Nonaktifkan typo</span>
        <span class="info-tip tip-left" tabindex="0" role="button" aria-label="Info">
          <span class="info-icon">i</span>
          <span class="tip-box" data-i18n="noTypoTip">Centang opsi ini jika Anda ingin pengetikan 100% sempurna tanpa simulasi salah ketik sama sekali.</span>
        </span>
      </label>
    </details>

    <div class="buttons button-group">
      <button id="preview" type="button" class="secondary" data-i18n="previewBtn">Pratinjau</button>
      <button id="startBtn" type="button" class="primary" data-i18n="startBtn">Mulai Mengetik</button>
    </div>

    <div class="buttons" style="margin-top: 6px;">
      <button id="pause" type="button" class="secondary" data-i18n="pauseBtn">Jeda</button>
      <button id="resume" type="button" class="secondary" data-i18n="resumeBtn">Lanjut</button>
      <button id="stop" type="button" class="danger" data-i18n="stopBtn">Berhenti</button>
    </div>

    <div id="status" class="status-box" role="status" data-i18n="defaultStatusPopup">
      Klik 'Mulai Mengetik', lalu segera klik kolom tujuan di halaman sebelum hitung mundur selesai.
    </div>

    <small data-i18n-html="tipPopupNote">
      Tips: Gunakan <strong>Buka Sidebar</strong> jika Anda ingin panel tetap terbuka saat berpindah fokus atau mengetik dokumen panjang.
    </small>
  </main>

  <script src="popup.js"></script>
</body>
</html>
